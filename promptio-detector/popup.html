<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Promptio Detector</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="popup.css"></head>
<body>
<header>
  <div class="id"><img src="icons/icon48.png" alt=""><div><b>Promptio Detector</b><span id="host">…</span></div></div>
  <div class="acts">
    <button id="pdf" class="primary" disabled>Informe PDF</button>
    <button id="json" disabled>JSON</button>
    <button id="md" disabled>Markdown</button>
    <button id="rescan" title="Volver a analizar">↻</button>
  </div>
</header>
<div id="state" class="state">Analizando…</div>
<main id="main" hidden>
  <div id="scores"></div>
  <nav id="tabs">
    <button data-t="privacy" class="on">Seguridad y privacidad</button><button data-t="stack">Stack</button><button data-t="audit">Auditoría</button><button data-t="page">Página</button>
    <button data-t="perf">Rendimiento</button><button data-t="dns">DNS y correo</button><button data-t="changes">Cambios</button>
  </nav>
  <div id="tools"><input id="filter" type="search" placeholder="Filtrar tecnologías…"><select id="area" hidden></select></div>
  <section id="view"></section>
</main>
<footer><span>Todo se analiza en tu navegador. <a id="clear" href="#">Borrar historial</a></span></footer>
<script src="signatures.js"></script><script src="detector.js"></script><script src="analysis.js"></script>
<script src="render.js"></script><script src="dns.js"></script><script src="popup.js"></script>
</body></html>
